[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-stablecoin-depeg-transmission"
version = "0.1.0"
description = "Apply asset shocks through a bounded acyclic backing graph and quantify reserve-weighted synthetic prices."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-stablecoin-depeg-transmission = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
